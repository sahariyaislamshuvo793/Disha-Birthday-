<div id="app">
  <div class="gallery">
    <p class="sr-only" id="live-region" aria-live="polite"></p>

    <div class="gallery-header mono">
      <span id="frame-label">FRAME 01</span>
      <span id="frame-count">01 / 10</span>
    </div>

    <div class="stage" id="stage" role="region" aria-roledescription="carousel" aria-label="Travel photo gallery"></div>

    <div class="controls">
      <button class="nav-btn" id="prev-btn" aria-label="Previous photo">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>

      <div class="dots" id="dots" role="tablist" aria-label="Choose photo"></div>

      <button class="nav-btn" id="next-btn" aria-label="Next photo">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </button>
    </div>
  </div>
</div>
