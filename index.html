<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seamless Horizontal Carousel Gallery</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #05070a;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* গ্যালারি কন্টেইনার */
    .carousel-container {
      position: relative;
      width: 100vw;
      height: 550px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
    }

    /* ট্র্যাক যেখানে সব ছবি গায়ে গায়ে লেগে থাকবে */
    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    /* প্রতিটি ছবির বক্স (কোন গ্যাপ থাকবে না) */
    .gallery-item {
      position: relative;
      flex: 0 0 160px; /* ডিফল্ট অবস্থায় পাশের ছবিগুলো ছোট থাকবে */
      height: 100%;
      cursor: pointer;
      overflow: hidden;
      transition: flex 0.6s cubic-bezier(0.25, 1, 0.5, 1), filter 0.6s ease;
      filter: brightness(40%) grayscale(30%);
      border-right: 1px solid rgba(255, 255, 255, 0.15); /* বর্ডার দিয়ে ছবিগুলোকে আলাদা চেনা যাবে */
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* টেক্সটের ওপর হালকা শ্যাডো */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(0, 0, 0, 0.85) 100%);
    }

    /* জায়গার নাম */
    .location-name {
      position: absolute;
      bottom: 30px;
      left: 30px;
      color: #ffffff;
      font-size: 1.4rem;
      font-weight: 700;
      white-space: nowrap;
      opacity: 0.5;
      transform: translateY(10px);
      transition: all 0.5s ease;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
    }

    /* অ্যাক্টিভ ছবি (যেটি সেন্টারে থাকবে ও বড় হবে) */
    .gallery-item.active {
      flex: 0 0 650px; /* অ্যাক্টিভ ছবিটা বড় হয়ে অনেকটা জায়গা নিবে */
      filter: brightness(100%) grayscale(0%);
      z-index: 2;
    }

    .gallery-item.active .location-name {
      opacity: 1;
      transform: translateY(0);
      font-size: 2.2rem;
    }

    /* এরো নেভিগেশন বাটন */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 1.5rem;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .prev-btn { left: 30px; }
    .next-btn { right: 30px; }

    /* রেসপন্সিভ এডজাস্টমেন্ট */
    @media (max-width: 768px) {
      .carousel-container { height: 420px; }
      .gallery-item { flex: 0 0 80px; }
      .gallery-item.active { flex: 0 0 280px; }
      .gallery-item.active .location-name { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <button class="nav-btn prev-btn" onclick="moveSlide(-1)">&#10094;</button>
    <button class="nav-btn next-btn" onclick="moveSlide(1)">&#10095;</button>

    <div class="carousel-track" id="track">
      
      <div class="gallery-item">
        <img src="https://picsum.photos/1000/800?random=1" alt="Sajek Valley">
        <div class="overlay"></div>
        <div class="location-name">Sajek Valley</div>
      </div>

      <div class="gallery-item">
        <img src="https://picsum.photos/1000/800?random=2" alt="Cox's Bazar">
        <div class="overlay"></div>
        <div class="location-name">Cox's Bazar</div>
      </div>

      <div class="gallery-item active">
        <img src="https://picsum.photos/1000/800?random=3" alt="Ratargul, Sylhet">
        <div class="overlay"></div>
        <div class="location-name">Ratargul, Sylhet</div>
      </div>

      <div class="gallery-item">
        <img src="https://picsum.photos/1000/800?random=4" alt="Saint Martin">
        <div class="overlay"></div>
        <div class="location-name">Saint Martin</div>
      </div>

      <div class="gallery-item">
        <img src="https://picsum.photos/1000/800?random=5" alt="Bandarban">
        <div class="overlay"></div>
        <div class="location-name">Bandarban</div>
      </div>

      <div class="gallery-item">
        <img src="https://picsum.photos/1000/800?random=6" alt="Sreemangal">
        <div class="overlay"></div>
        <div class="location-name">Sreemangal</div>
      </div>

      <div class="gallery-item">
        <img src="https://picsum.photos/1000/800?random=7" alt="Sundarbans">
        <div class="overlay"></div>
        <div class="location-name">Sundarbans</div>
      </div>

    </div>
  </div>

  <script>
    const track = document.getElementById('track');
    const items = document.querySelectorAll('.gallery-item');
    let currentIndex = 2; // ডিফল্টভাবে ৩ নম্বর ছবি সেন্টারে থাকবে

    function updateCarousel() {
      items.forEach((item, index) => {
        item.classList.remove('active');
        if (index === currentIndex) {
          item.classList.add('active');
        }
      });

      // সেন্টারে অ্যাক্টিভ ছবিটাকে রাখার জন্য ক্যালকুলেশন
      const activeItem = items[currentIndex];
      const containerWidth = document.querySelector('.carousel-container').offsetWidth;
      
      let offsetLeft = 0;
      for (let i = 0; i < currentIndex; i++) {
        offsetLeft += items[i].offsetWidth;
      }
      
      const centerPos = offsetLeft - (containerWidth / 2) + (activeItem.offsetWidth / 2);
      track.style.transform = `translateX(${-centerPos}px)`;
    }

    function moveSlide(direction) {
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= items.length) currentIndex = items.length - 1;
      updateCarousel();
    }

    // ছবিতে সরাসরি ক্লিক করলেও সেন্টারে আসবে
    items.forEach((item, index) => {
      item.addEventListener('click', () => {
        currentIndex = index;
        updateCarousel();
      });
    });

    // পেজ লোড হওয়ার সাথে সাথে পজিশন সেটআপ
    window.addEventListener('load', updateCarousel);
    window.addEventListener('resize', updateCarousel);
  </script>

</body>
</html>
