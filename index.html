<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 3D Perspective Photo Gallery</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0d17;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Background Orbs */
    .bg-glow-1 {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, rgba(0,0,0,0) 70%);
      top: -100px;
      left: -100px;
      border-radius: 50%;
      pointer-events: none;
    }

    .bg-glow-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(236,72,153,0.2) 0%, rgba(0,0,0,0) 70%);
      bottom: -150px;
      right: -100px;
      border-radius: 50%;
      pointer-events: none;
    }

    /* Grid Overlay */
    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
    }

    /* Header Container */
    .header {
      text-align: center;
      margin-bottom: 40px;
      z-index: 2;
      padding: 0 20px;
    }

    .header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .header p {
      color: #94a3b8;
      font-size: 1.05rem;
      font-weight: 400;
    }

    /* 3D Stage & Gallery Container */
    .gallery-stage {
      perspective: 1000px;
      width: 100%;
      max-width: 1200px;
      padding: 20px;
      display: flex;
      justify-content: center;
      z-index: 2;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      width: 100%;
      transform-style: preserve-3d;
    }

    /* 3D Interactive Card */
    .card-container {
      perspective: 1000px;
    }

    .card {
      position: relative;
      height: 380px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      overflow: hidden;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease, border-color 0.3s ease;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    }

    .card:hover {
      border-color: rgba(165, 180, 252, 0.4);
      box-shadow: 0 25px 50px rgba(99, 102, 241, 0.25);
    }

    /* Image Wrapper */
    .card-img-wrapper {
      position: absolute;
      inset: 12px;
      bottom: 80px;
      border-radius: 14px;
      overflow: hidden;
      transform: translateZ(20px);
      transition: transform 0.3s ease;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img-wrapper img {
      transform: scale(1.08);
    }

    /* Card Details */
    .card-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transform: translateZ(30px);
    }

    .card-info h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .card-info span {
      font-size: 0.85rem;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.15);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    /* Floating Glare / Shine Effect */
    .glare {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.15), transparent 60%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      mix-blend-mode: overlay;
    }

    .card:hover .glare {
      opacity: 1;
    }

    /* Modal / Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 15, 0.85);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content {
      max-width: 900px;
      max-height: 85vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
    }

    .lightbox.active .lightbox-content {
      transform: scale(1);
    }

    .lightbox-content img {
      width: 100%;
      height: 100%;
      max-height: 75vh;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .lightbox-caption {
      padding: 15px 25px;
      background: rgba(15, 23, 42, 0.95);
      text-align: center;
      font-size: 1.1rem;
      color: #e2e8f0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .lightbox-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.5rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
      z-index: 101;
    }

    .lightbox-close:hover {
      background: rgba(239, 68, 68, 0.8);
    }
  </style>
</head>
<body>

  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>
  <div class="grid-overlay"></div>

  <div class="header">
    <h1>3D Interactive Gallery</h1>
    <p>মাউস কার্সার ছবিগুলোর ওপর মুভ করে ৩D ট্র্যাকিং ইফেক্ট ফিল করুন</p>
  </div>

  <div class="gallery-stage">
    <div class="gallery-grid">
      
      <!-- Card 1 -->
      <div class="card-container">
        <div class="card" onclick="openLightbox('https://picsum.photos/1200/800?random=10', 'Aesthetic Cyber City')">
          <div class="glare"></div>
          <div class="card-img-wrapper">
            <img src="https://picsum.photos/600/700?random=10" alt="Gallery Image 1">
          </div>
          <div class="card-info">
            <h3>Cyber City</h3>
            <span>#01</span>
          </div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="card-container">
        <div class="card" onclick="openLightbox('https://picsum.photos/1200/800?random=11', 'Neon Horizon')">
          <div class="glare"></div>
          <div class="card-img-wrapper">
            <img src="https://picsum.photos/600/700?random=11" alt="Gallery Image 2">
          </div>
          <div class="card-info">
            <h3>Neon Horizon</h3>
            <span>#02</span>
          </div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="card-container">
        <div class="card" onclick="openLightbox('https://picsum.photos/1200/800?random=12', 'Abstract Wave')">
          <div class="glare"></div>
          <div class="card-img-wrapper">
            <img src="https://picsum.photos/600/700?random=12" alt="Gallery Image 3">
          </div>
          <div class="card-info">
            <h3>Abstract Wave</h3>
            <span>#03</span>
          </div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="card-container">
        <div class="card" onclick="openLightbox('https://picsum.photos/1200/800?random=13', 'Future Architecture')">
          <div class="glare"></div>
          <div class="card-img-wrapper">
            <img src="https://picsum.photos/600/700?random=13" alt="Gallery Image 4">
          </div>
          <div class="card-info">
            <h3>Future Arch</h3>
            <span>#04</span>
          </div>
        </div>
      </div>

      <!-- Card 5 -->
      <div class="card-container">
        <div class="card" onclick="openLightbox('https://picsum.photos/1200/800?random=14', 'Dark Minimalist')">
          <div class="glare"></div>
          <div class="card-img-wrapper">
            <img src="https://picsum.photos/600/700?random=14" alt="Gallery Image 5">
          </div>
          <div class="card-info">
            <h3>Dark Minimal</h3>
            <span>#05</span>
          </div>
        </div>
      </div>

      <!-- Card 6 -->
      <div class="card-container">
        <div class="card" onclick="openLightbox('https://picsum.photos/1200/800?random=15', 'Luminous Glow')">
          <div class="glare"></div>
          <div class="card-img-wrapper">
            <img src="https://picsum.photos/600/700?random=15" alt="Gallery Image 6">
          </div>
          <div class="card-info">
            <h3>Luminous Glow</h3>
            <span>#06</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-content">
      <button class="lightbox-close" onclick="closeLightbox(event, true)">&times;</button>
      <img id="lightbox-img" src="" alt="Enlarged Image">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
  </div>

  <script>
    // 3D Tilt Effect on Mouse Move
    const cards = document.querySelectorAll('.card');

    cards.forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -15; // Max tilt angle X
        const rotateY = ((x - centerX) / centerX) * 15;  // Max tilt angle Y

        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.03, 1.03, 1.03)`;
        
        // Dynamic Glare positioning
        const glare = card.querySelector('.glare');
        glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255, 255, 255, 0.25), transparent 60%)`;
      });

      card.addEventListener('mouseleave', () => {
        card.style.transform = `rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
      });
    });

    // Lightbox / Modal Logic
    function openLightbox(imgSrc, captionText) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const lightboxCaption = document.getElementById('lightbox-caption');

      lightboxImg.src = imgSrc;
      lightboxCaption.innerText = captionText;
      lightbox.classList.add('active');
    }

    function closeLightbox(e, force = false) {
      if (force || e.target.id === 'lightbox') {
        const lightbox = document.getElementById('lightbox');
        lightbox.classList.remove('active');
      }
    }
  </script>
</body>
</html>
