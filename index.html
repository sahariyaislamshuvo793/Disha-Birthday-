<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizontal Expandable Gallery</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #08090d;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* গ্যালারি কন্টেইনার */
    .gallery-container {
      display: flex;
      gap: 15px;
      width: 90vw;
      max-width: 1200px;
      height: 520px;
      padding: 10px;
    }

    /* প্রতিটি ছবির স্লাইড */
    .gallery-item {
      position: relative;
      flex: 1; /* ডিফল্ট অবস্থায় সবগুলো ছোট হয়ে সাইডে থাকবে */
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      transition: flex 0.7s cubic-bezier(0.25, 1, 0.5, 1), transform 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(75%);
      transition: filter 0.5s ease, transform 0.7s ease;
    }

    /* কাস্টম ওভারলে (ডার্ক শ্যাডো) */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 40%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
    }

    /* শুধু জায়গার নাম */
    .location-name {
      position: absolute;
      bottom: 30px;
      left: 30px;
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 1px;
      white-space: nowrap;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
      opacity: 0.8;
      transform: translateY(10px);
      transition: all 0.5s ease;
    }

    /* অ্যাক্টিভ অবস্থা (যে ছবিতে ক্লিক বা টান দেওয়া হবে সেটি বড় হবে) */
    .gallery-item.active {
      flex: 5; /* এই ছবিটা বড় হয়ে অনেকটা জায়গা নিবে */
      border-color: rgba(255, 255, 255, 0.4);
    }

    .gallery-item.active img {
      filter: brightness(100%);
      transform: scale(1.03);
    }

    .gallery-item.active .location-name {
      opacity: 1;
      transform: translateY(0);
      font-size: 2.2rem;
    }

    /* মাউস হভার ইফেক্ট */
    .gallery-item:hover:not(.active) {
      flex: 1.3;
    }

    /* মোবাইল ডিভাইসের জন্য রেসপন্সিভ */
    @media (max-width: 768px) {
      .gallery-container {
        flex-direction: column;
        height: 80vh;
      }

      .gallery-item.active {
        flex: 4;
      }

      .location-name {
        font-size: 1.2rem;
        bottom: 20px;
        left: 20px;
      }

      .gallery-item.active .location-name {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    
    <!-- পিকচার ১ -->
    <div class="gallery-item active">
      <img src="https://picsum.photos/1000/800?random=1" alt="Sajek Valley">
      <div class="overlay"></div>
      <div class="location-name">Sajek Valley</div>
    </div>

    <!-- পিকচার ২ -->
    <div class="gallery-item">
      <img src="https://picsum.photos/1000/800?random=2" alt="Cox's Bazar">
      <div class="overlay"></div>
      <div class="location-name">Cox's Bazar</div>
    </div>

    <!-- পিকচার ৩ -->
    <div class="gallery-item">
      <img src="https://picsum.photos/1000/800?random=3" alt="Sylhet Ratargul">
      <div class="overlay"></div>
      <div class="location-name">Ratargul, Sylhet</div>
    </div>

    <!-- পিকচার ৪ -->
    <div class="gallery-item">
      <img src="https://picsum.photos/1000/800?random=4" alt="Saint Martin">
      <div class="overlay"></div>
      <div class="location-name">Saint Martin</div>
    </div>

    <!-- পিকচার ৫ -->
    <div class="gallery-item">
      <img src="https://picsum.photos/1000/800?random=5" alt="Bandarban">
      <div class="overlay"></div>
      <div class="location-name">Bandarban</div>
    </div>

  </div>

  <script>
    const items = document.querySelectorAll('.gallery-item');

    items.forEach(item => {
      item.addEventListener('click', () => {
        // আগের অ্যাক্টিভ ক্লাস সরিয়ে নেওয়া
        items.forEach(i => i.classList.remove('active'));
        // নতুন ক্লিকে অ্যাক্টিভ ক্লাস দেওয়া
        item.classList.add('active');
      });
    });
  </script>

</body>
</html>
