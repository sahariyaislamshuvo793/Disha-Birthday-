<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Style Slider</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* পোস্ট কন্টেইনার */
    .post-card {
      width: 100%;
      max-width: 470px; /* ইনস্টাগ্রাম পোস্টের স্ট্যান্ডার্ড সাইজ */
      background-color: #000000;
      border: 1px solid #262626;
      border-radius: 8px;
      overflow: hidden;
    }

    /* ১. হেডার অংশ (প্রোফাইল, নাম, লোকেশন) */
    .post-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
    }

    .profile-pic {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 12px;
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .username-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .username {
      font-weight: 600;
      font-size: 14px;
      color: #fff;
    }

    .verified-badge {
      width: 14px;
      height: 14px;
      fill: #0095f6;
    }

    .location {
      font-size: 12px;
      color: #a8a8a8;
      margin-top: 2px;
    }

    /* ২. ইমেজ স্লাইডার অংশ */
    .slider-wrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }

    .slider-wrapper:active {
      cursor: grabbing;
    }

    /* পিকচার কাউন্টার (যেমন: 1/5) */
    .image-counter {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(38, 38, 38, 0.75);
      color: #f5f5f5;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 12px;
      z-index: 10;
      font-weight: 500;
    }

    .slider-track {
      display: flex;
      transition: transform 0.3s ease-out;
      will-change: transform;
    }

    .slide {
      flex: 0 0 100%;
      aspect-ratio: 4 / 5; /* ইনস্টাগ্রাম পোর্ট্রেট রেশিও */
      background-color: #121212;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* ৩. ফুটার ডট (Indicators) */
    .post-footer {
      padding: 12px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .dots-container {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #555555;
      transition: background-color 0.3s ease, transform 0.3s ease;
    }

    .dot.active {
      background-color: #0095f6;
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <div class="post-card">
    
    <!-- হেডার (প্রোফাইল পিক, নাম ও লোকেশন) -->
    <div class="post-header">
      <img src="https://picsum.photos/100/100?random=99" alt="Profile" class="profile-pic">
      <div class="user-info">
        <div class="username-row">
          <span class="username">heroemaniaco</span>
          <!-- ভেরিফাইড ব্যাজ -->
          <svg class="verified-badge" viewBox="0 0 24 24">
            <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6.2 12.8l1.4-1.4 2.5 2.5 6.1-6.1 1.4 1.4-7.5 7.5z"/>
          </svg>
        </div>
        <span class="location">Madrid, Spain</span>
      </div>
    </div>

    <!-- ছবি ও টান দেওয়ার স্লাইডার এলাকা -->
    <div class="slider-wrapper" id="sliderWrapper">
      <!-- ছবি গণনার সংখ্যা (1/5) -->
      <div class="image-counter" id="imageCounter">1/5</div>

      <div class="slider-track" id="sliderTrack">
        <div class="slide"><img src="https://picsum.photos/600/750?random=1" alt="Post 1"></div>
        <div class="slide"><img src="https://picsum.photos/600/750?random=2" alt="Post 2"></div>
        <div class="slide"><img src="https://picsum.photos/600/750?random=3" alt="Post 3"></div>
        <div class="slide"><img src="https://picsum.photos/600/750?random=4" alt="Post 4"></div>
        <div class="slide"><img src="https://picsum.photos/600/750?random=5" alt="Post 5"></div>
      </div>
    </div>

    <!-- নিচের ডট ইন্ডিকেটর -->
    <div class="post-footer">
      <div class="dots-container" id="dotsContainer"></div>
    </div>

  </div>

  <script>
    const wrapper = document.getElementById('sliderWrapper');
    const track = document.getElementById('sliderTrack');
    const slides = document.querySelectorAll('.slide');
    const counter = document.getElementById('imageCounter');
    const dotsContainer = document.getElementById('dotsContainer');

    let currentIndex = 0;
    let isDragging = false;
    let startPos = 0;
    let currentTranslate = 0;
    let prevTranslate = 0;
    let animationID = 0;

    // ১. ডট ইন্ডিকেটর তৈরি
    slides.forEach((_, index) => {
      const dot = document.createElement('div');
      dot.classList.add('dot');
      if (index === 0) dot.classList.add('active');
      dotsContainer.appendChild(dot);
    });

    const dots = document.querySelectorAll('.dot');

    // ২. ইভেন্ট লিসেনার (টান দেওয়া এবং সোয়াইপ করার জন্য)
    wrapper.addEventListener('touchstart', touchStart);
    wrapper.addEventListener('touchmove', touchMove);
    wrapper.addEventListener('touchend', touchEnd);

    wrapper.addEventListener('mousedown', touchStart);
    wrapper.addEventListener('mousemove', touchMove);
    wrapper.addEventListener('mouseup', touchEnd);
    wrapper.addEventListener('mouseleave', touchEnd);

    function touchStart(e) {
      isDragging = true;
      startPos = getPositionX(e);
      animationID = requestAnimationFrame(animation);
      track.style.transition = 'none';
    }

    function touchMove(e) {
      if (!isDragging) return;
      const currentPosition = getPositionX(e);
      currentTranslate = prevTranslate + currentPosition - startPos;
    }

    function touchEnd() {
      if (!isDragging) return;
      isDragging = false;
      cancelAnimationFrame(animationID);

      const movedBy = currentTranslate - prevTranslate;

      // ছবি স্লাইড করার থ্রেশহোল্ড
      if (movedBy < -50 && currentIndex < slides.length - 1) {
        currentIndex += 1;
      }
      if (movedBy > 50 && currentIndex > 0) {
        currentIndex -= 1;
      }

      updateSlider();
    }

    function getPositionX(e) {
      return e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
    }

    function animation() {
      track.style.transform = `translateX(${currentTranslate}px)`;
      if (isDragging) requestAnimationFrame(animation);
    }

    function updateSlider() {
      currentTranslate = currentIndex * -wrapper.clientWidth;
      prevTranslate = currentTranslate;
      track.style.transition = 'transform 0.3s ease-out';
      track.style.transform = `translateX(${currentTranslate}px)`;

      // কাউন্টার টেক্সট আপডেট (যেমন: 2/5)
      counter.textContent = `${currentIndex + 1}/${slides.length}`;

      // ডট আপডেট
      dots.forEach((dot, index) => {
        dot.classList.toggle('active', index === currentIndex);
      });
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মামা ছবির ফাইল গ্যালারি</title>
  <style>
    /* ১. বেসিক পেজ স্টাইল */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
    }

    /* ২. ছবির "ফাইল" বা কন্টেইনার স্টাইল */
    /* এখানে আপনার সব ছবি একসাথে জমা থাকবে */
    .file-gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      max-width: 1000px;
      padding: 20px;
      background-color: #fff;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    /* ৩. পোলারয়েড (Polaroid) স্টাইল */
    .polaroid {
      background: #fff;
      padding: 10px;
      padding-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      cursor: pointer;
      border-radius: 5px;
    }

    /* ছবিতে হভার করলে একটু বড় হবে */
    .polaroid:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .polaroid img {
      width: 100%;
      height: 200px;
      object-fit: cover; /* ছবি যেন ফেটে না যায় বা টেনে বড় না হয় */
      border: 1px solid #ddd;
    }

    /* ৪. লাইটবক্স (মডাল) স্টাইল - ছবি বড় হয়ে দেখার জন্য */
    .lightbox {
      display: none; /* ডিফল্টভাবে লুকানো থাকবে */
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9); /* পেছনের ব্যাকগ্রাউন্ড কালো হবে */
      align-items: center;
      justify-content: center;
    }

    /* লাইটবক্স যখন অ্যাক্টিভ হবে তখন ছবি দেখাবে */
    .lightbox.active {
      display: flex;
    }

    /* বড় ছবি */
    .lightbox-content {
      max-width: 90%;
      max-height: 80%;
      border-radius: 5px;
      border: 5px solid #fff;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    /* ক্লোজ বাটন স্টাইল */
    .close-lightbox {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>মামা, আপনার ছবির ফাইল গ্যালারি</h1>

  <!-- ছবি জমা রাখার ফাইল -->
  <div class="file-gallery-container">
    
    <!-- ছবি ১ -->
    <div class="polaroid" onclick="openLightbox(this)">
      <img src="https://picsum.photos/400/500?random=1" alt="ছবি ১">
    </div>

    <!-- ছবি ২ -->
    <div class="polaroid" onclick="openLightbox(this)">
      <img src="https://picsum.photos/400/500?random=2" alt="ছবি ২">
    </div>

    <!-- ছবি ৩ -->
    <div class="polaroid" onclick="openLightbox(this)">
      <img src="https://picsum.photos/400/500?random=3" alt="ছবি ৩">
    </div>

    <!-- ছবি ৪ -->
    <div class="polaroid" onclick="openLightbox(this)">
      <img src="https://picsum.photos/400/500?random=4" alt="ছবি ৪">
    </div>

    <!-- ছবি ৫ -->
    <div class="polaroid" onclick="openLightbox(this)">
      <img src="https://picsum.photos/400/500?random=5" alt="ছবি ৫">
    </div>

    <!-- ছবি ৬ -->
    <div class="polaroid" onclick="openLightbox(this)">
      <img src="https://picsum.photos/400/500?random=6" alt="ছবি ৬">
    </div>
  </div>

  <!-- বড় ছবি দেখার লাইটবক্স -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <span class="close-lightbox" onclick="closeLightbox(event, true)">&times;</span>
    <img class="lightbox-content" id="lightbox-img" src="" alt="বড় ছবি">
  </div>

  <!-- JavaScript - ছবি খোলা ও বন্ধ করার লজিক -->
  <script>
    // লাইটবক্স খোলার ফাংশন
    function openLightbox(element) {
      // যে পোলারয়েডে ক্লিক করা হয়েছে, তার ভেতরের ছবির 'src' নেওয়া হচ্ছে
      const imgSrc = element.querySelector('img').src;
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');

      // লাইটবক্সের ছবির 'src' সেট করা হচ্ছে
      lightboxImg.src = imgSrc;
      // লাইটবক্স চালু করা হচ্ছে
      lightbox.classList.add('active');
    }

    // লাইটবক্স বন্ধ করার ফাংশন
    function closeLightbox(event, forceClose = false) {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');

      // যদি ক্লোজ বাটনে ক্লিক করা হয় অথবা বড় ছবির বাইরে কালো জায়গায় ক্লিক করা হয়
      if (forceClose || event.target === lightbox) {
        // লাইটবক্স বন্ধ করা হচ্ছে
        lightbox.classList.remove('active');
        // ছবি বন্ধ করার পর পরেরবার যেন আগের ছবি না দেখা যায়, তাই 'src' খালি করা হচ্ছে
        lightboxImg.src = '';
      }
    }
  </script>

</body>
</html>
