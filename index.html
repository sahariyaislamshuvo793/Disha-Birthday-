<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Interactive Web Experience</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: #0b0c10;
      color: #ffffff;
    }

    /* 3D Canvas fixed in background */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: auto;
    }

    /* UI Content Overlay */
    .content-overlay {
      position: relative;
      z-index: 2;
      pointer-events: none; /* Allows mouse interactions to pass through to 3D canvas */
    }

    section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 10%;
    }

    .interactive-element {
      pointer-events: auto; /* Re-enable pointer events for buttons/links */
    }

    h1 {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 1rem;
      background: linear-gradient(45deg, #66fcf1, #45a29e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.25rem;
      color: #c5c6c7;
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 12px 32px;
      background-color: #66fcf1;
      color: #0b0c10;
      font-weight: bold;
      text-decoration: none;
      border-radius: 30px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: fit-content;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(102, 252, 241, 0.3);
    }
  </style>

  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GSAP for Smooth Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>
<body>

  <!-- WebGL Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- HTML Content Overlay -->
  <div class="content-overlay">
    <section>
      <h1>Next-Gen <br>Digital Design</h1>
      <p>Experience immersive 3D interactive web experiences built for high performance and seamless interaction.</p>
      <a href="#about" class="btn interactive-element">Explore Work</a>
    </section>

    <section id="about">
      <h1>Dynamic Depth</h1>
      <p>Scroll to interact with lighting, materials, and motion in real-time right inside your web browser.</p>
    </section>
  </div>

  <script>
    // ----------------------------------------------------
    // 1. SCENE SETUP
    // ----------------------------------------------------
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      75, 
      window.innerWidth / window.innerHeight, 
      0.1, 
      1000
    );
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // ----------------------------------------------------
    // 2. 3D OBJECT (Icosahedron with Glass-like Material)
    // ----------------------------------------------------
    const geometry = new THREE.IcosahedronGeometry(1.8, 0);
    const material = new THREE.MeshPhysicalMaterial({
      color: 0x45a29e,
      roughness: 0.1,
      metalness: 0.1,
      transmission: 0.6, // Glass transparency effect
      ior: 1.5,
      reflectivity: 0.9,
      clearcoat: 1.0,
      clearcoatRoughness: 0.1,
      wireframe: true // Switch to false for a solid shaded shape
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // ----------------------------------------------------
    // 3. LIGHTING
    // ----------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0x66fcf1, 2);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    const pointLight2 = new THREE.PointLight(0xff007f, 1.5);
    pointLight2.position.set(-5, -5, -2);
    scene.add(pointLight2);

    // ----------------------------------------------------
    // 4. MOUSE INTERACTION (Parallax Effect)
    // ----------------------------------------------------
    let mouseX = 0;
    let mouseY = 0;

    window.addEventListener('mousemove', (event) => {
      mouseX = (event.clientX / window.innerWidth - 0.5) * 2;
      mouseY = -(event.clientY / window.innerHeight - 0.5) * 2;
    });

    // ----------------------------------------------------
    // 5. SCROLL ANIMATION (GSAP + ScrollTrigger)
    // ----------------------------------------------------
    gsap.registerPlugin(ScrollTrigger);

    gsap.to(mesh.rotation, {
      x: Math.PI * 2,
      y: Math.PI * 2,
      scrollTrigger: {
        trigger: ".content-overlay",
        start: "top top",
        end: "bottom bottom",
        scrub: 1
      }
    });

    gsap.to(mesh.position, {
      x: 1.5,
      scrollTrigger: {
        trigger: "#about",
        start: "top bottom",
        end: "top center",
        scrub: 1
      }
    });

    // ----------------------------------------------------
    // 6. ANIMATION LOOP
    // ----------------------------------------------------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      // Continuous Idle Rotation
      mesh.rotation.x += 0.003;
      mesh.rotation.y += 0.005;

      // Smooth Mouse Following
      mesh.position.x += (mouseX * 0.5 - mesh.position.x) * 0.05;
      mesh.position.y += (mouseY * 0.5 - mesh.position.y) * 0.05;

      renderer.render(scene, camera);
    }

    animate();

    // ----------------------------------------------------
    // 7. RESPONSIVE RESIZE
    // ----------------------------------------------------
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
