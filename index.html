<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Bangladesh</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="bg"></div>

<header>

<h1>🇧🇩 Explore Bangladesh</h1>

<p>Click any district pin to explore.</p>

<input type="text" id="search" placeholder="Search District...">

</header>

<section class="map-box">

<img src="images/bangladesh-map.png" class="map">

<div class="pin dhaka" onclick="showDistrict('dhaka')"></div>

<div class="pin cox" onclick="showDistrict('cox')"></div>

<div class="pin sylhet" onclick="showDistrict('sylhet')"></div>

<div class="pin rangpur" onclick="showDistrict('rangpur')"></div>

<div class="pin rajshahi" onclick="showDistrict('rajshahi')"></div>

<div class="pin khulna" onclick="showDistrict('khulna')"></div>

<div class="pin barishal" onclick="showDistrict('barishal')"></div>

<div class="pin chittagong" onclick="showDistrict('chittagong')"></div>

<div class="pin mymensingh" onclick="showDistrict('mymensingh')"></div>

<div class="pin sundarban" onclick="showDistrict('sundarban')"></div>

</section>

<div class="popup" id="popup">

<span class="close" onclick="closePopup()">✖</span>

<img id="photo">

<h2 id="title"></h2>

<p id="details"></p>

</div>

<script src="script.js"></script>

</body>
</html>
