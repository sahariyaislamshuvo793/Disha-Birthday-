<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unique 3D Particle Constellation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050508;
      color: #ffffff;
    }

    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .ui-layer {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 8vw;
      pointer-events: none;
    }

    .badge {
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #00f2fe;
      margin-bottom: 1.5rem;
      pointer-events: auto;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      max-width: 700px;
    }

    p {
      font-size: 1.1rem;
      color: #94a3b8;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      pointer-events: auto;
    }

    .btn-primary {
      padding: 14px 32px;
      border-radius: 30px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(79, 70, 229, 0.6);
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <div class="ui-layer">
    <div class="badge">Interactive WebGL</div>
    <h1>Constellation of Digital Ideas</h1>
    <p>A dynamic, particle-driven 3D experience designed with WebGL for futuristic web interfaces.</p>
    <div class="btn-group">
      <a href="#" class="btn-primary">Launch Experience</a>
    </div>
  </div>

  <script>
    // 1. SCENE & CAMERA
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    
    // Add subtle fog for depth
    scene.fog = new THREE.FogExp2(0x050508, 0.05);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // 2. CREATE PARTICLES SPHERE
    const count = 4000;
    const positions = new Float32Array(count * 3);
    const originalPositions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    const color1 = new THREE.Color(0x4f46e5); // Indigo
    const color2 = new THREE.Color(0x06b6d4); // Cyan

    const radius = 3;

    for (let i = 0; i < count; i++) {
      // Golden ratio algorithm for uniform distribution on a sphere
      const phi = Math.acos(-1 + (2 * i) / count);
      const theta = Math.sqrt(count * Math.PI) * phi;

      const x = radius * Math.cos(theta) * Math.sin(phi);
      const y = radius * Math.sin(theta) * Math.sin(phi);
      const z = radius * Math.cos(phi);

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      originalPositions[i * 3] = x;
      originalPositions[i * 3 + 1] = y;
      originalPositions[i * 3 + 2] = z;

      // Color Gradient based on height
      const mixedColor = color1.clone().lerp(color2, (y + radius) / (radius * 2));
      colors[i * 3] = mixedColor.r;
      colors[i * 3 + 1] = mixedColor.g;
      colors[i * 3 + 2] = mixedColor.b;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Particle Texture & Material
    const particleMaterial = new THREE.PointsMaterial({
      size: 0.04,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(geometry, particleMaterial);
    scene.add(particleSystem);

    // 3. MOUSE INTERACTION & RAYCASTING
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-1000, -1000);
    const targetRotation = new THREE.Vector2(0, 0);

    window.addEventListener('mousemove', (e) => {
      // Normalized Mouse Coords
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      targetRotation.x = mouse.y * 0.3;
      targetRotation.y = mouse.x * 0.3;
    });

    // 4. ANIMATION LOOP
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();

      // Smooth Rotation
      particleSystem.rotation.y += 0.002;
      particleSystem.rotation.x += (targetRotation.x - particleSystem.rotation.x) * 0.05;
      particleSystem.rotation.y += (targetRotation.y - particleSystem.rotation.y) * 0.05;

      // Raycasting for Particle Dispersion Effect
      raycaster.setFromCamera(mouse, camera);
      const posAttr = geometry.attributes.position;

      for (let i = 0; i < count; i++) {
        let px = originalPositions[i * 3];
        let py = originalPositions[i * 3 + 1];
        let pz = originalPositions[i * 3 + 2];

        // Add subtle organic wave motion
        px += Math.sin(time + py) * 0.02;
        py += Math.cos(time + px) * 0.02;

        posAttr.setXYZ(i, px, py, pz);
      }

      posAttr.needsUpdate = true;
      renderer.render(scene, camera);
    }

    animate();

    // 5. RESIZE
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
